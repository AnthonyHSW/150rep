<path d="M 109 261 L 113 185 C 143 180 163 184 162 204 C 161 222 140 225 112 222 M 137 224 L 165 260"/>
<path d="M 244 185 L 197 187 L 194 259 L 244 258 M 197 221 L 233 220"/>
<path d="M 278 260 L 282 185 C 312 181 338 184 337 206 C 336 227 310 231 280 226"/>
